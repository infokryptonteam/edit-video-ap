<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clinical Case Presentation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#eaf1f5;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#10252f}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}
#app{width:min(100vw,56.25vh);height:min(100vh,177.777vw);max-width:100vw;max-height:100vh;background:#fff;position:relative;overflow:hidden;box-shadow:0 0 35px #0002}
.slide{position:absolute;inset:0;padding:7% 7% 8%;display:none;flex-direction:column;background:linear-gradient(150deg,#fff 0%,#f8fbfc 65%,#eef7f8 100%)}
.slide.active{display:flex;animation:in .55s ease both}
@keyframes in{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.top{display:flex;flex-direction:column;gap:3px;border-left:4px solid #159a9c;padding-left:12px;margin-top:10%;margin-bottom:2%}
.doctor{font-size:clamp(16px,4.2vw,26px);font-weight:900;letter-spacing:-.35px}
.clinic{font-size:clamp(8px,2.1vw,13px);font-weight:800;color:#176e75}
.address,.phone{font-size:clamp(7px,1.8vw,11px);font-weight:700;color:#60747b}.phone{color:#159a9c}
.kicker{margin-top:auto;color:#159a9c;font-size:11px;font-weight:900;letter-spacing:2px}
h1,h2{margin:6px 0 7px;line-height:1.02;letter-spacing:-1px;font-weight:850}h1{font-size:clamp(30px,8vw,52px)}h2{font-size:clamp(24px,6.8vw,42px)}
.desc{font-size:clamp(9px,2.3vw,14px);line-height:1.4;color:#51656c;max-width:92%}
.imageBox{margin-top:6%;height:55%;border:1px solid #d6e2e5;border-radius:22px;background:#f3f7f8;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 15px 35px #0d3b3f12}
.imageBox img{width:100%;height:100%;object-fit:contain}
.label{font-size:8px;font-weight:900;letter-spacing:1.8px;color:#159a9c;margin-top:5%}
.small{font-size:11px;color:#6a7b80}.end{margin-top:auto;border-top:1px solid #dce7e9;padding-top:14px}
.caseCard{margin-top:8%;border:1px solid #d8e5e7;border-radius:18px;background:#fff;box-shadow:0 12px 30px #0d3b3f0d;overflow:hidden}.caseCard>div{padding:14px 16px;border-bottom:1px solid #e4edef}.caseCard>div:last-child{border-bottom:0}.caseCard span{display:block;font-size:8px;letter-spacing:1.4px;font-weight:900;color:#159a9c;margin-bottom:4px}.caseCard strong{font-size:13px;line-height:1.25;font-weight:800;color:#17353c}.introNote{margin-top:auto;font-size:9px;line-height:1.5;color:#718187;padding-top:16px;border-top:1px solid #dce7e9}.end .doc{font-size:16px;font-weight:900}.end .clinicEnd{font-size:9px;color:#60747b;font-weight:700;line-height:1.5;margin-top:5px}
.controls{position:absolute;left:0;right:0;bottom:2.5%;display:flex;justify-content:center;gap:10px;z-index:20}
.controls button{border:0;background:#102f35;color:#fff;border-radius:999px;width:42px;height:42px;font-size:18px;box-shadow:0 8px 20px #0002}
.progress{position:absolute;left:7%;right:7%;bottom:0;height:3px;background:#dfe9eb;z-index:21}.bar{height:100%;width:0;background:#159a9c}
#editor{position:absolute;inset:0;background:#f4f8f9;z-index:50;display:none;overflow:auto;padding:18px 17px 28px}
#editor.open{display:block}
.editorHead{font-size:25px;font-weight:900;letter-spacing:-.7px;margin-bottom:3px;color:#102d34}
.editorSub{font-size:12px;color:#708187;line-height:1.45;margin-bottom:18px}
.sectionTitle{font-size:11px;font-weight:900;letter-spacing:1.3px;color:#159a9c;margin:18px 0 8px}
.field{margin:10px 0}.field label{display:block;font-size:10px;font-weight:900;letter-spacing:.8px;color:#5b6f75;margin-bottom:5px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid #cfdddf;border-radius:13px;background:#fff;font:inherit;color:#10252f;outline:none}
input:focus,textarea:focus,select:focus{border-color:#159a9c;box-shadow:0 0 0 3px #159a9c18}
textarea{min-height:66px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.imageFields{display:none}.imageFields.show{display:block}
.imgRow{padding:13px;background:#fff;border:1px solid #d9e5e7;border-radius:16px;margin:9px 0;box-shadow:0 5px 16px #12343b08}
.imgHead{display:flex;align-items:center;gap:9px;margin-bottom:10px}.num{width:28px;height:28px;border-radius:50%;background:#e8f5f5;color:#159a9c;display:grid;place-items:center;font-weight:900;font-size:12px}
.imgHead strong{font-size:14px}.upload{display:block;padding:11px;border:1px dashed #a9c8ca;border-radius:11px;background:#f7fbfb;text-align:center;font-size:12px;font-weight:800;color:#176e75;cursor:pointer}
.upload input{display:none}.fileName{font-size:10px;color:#7b8b90;margin-top:5px}
.actions{position:sticky;bottom:0;background:linear-gradient(#f4f8f900,#f4f8f9 25%);padding:18px 0 0;display:flex;gap:9px}
.actions button{flex:1;padding:14px;border:0;border-radius:13px;font-weight:900;font-size:13px}.save{background:#123b42;color:#fff}.close{background:#dfe8ea;color:#18343b}
#editHot{position:absolute;top:0;left:0;width:38px;height:38px;z-index:60;opacity:0}
#editHint{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:8px;color:#9aabad;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<div id="slides"></div>
<button id="editHot" aria-label="Edit"></button>
<div class="controls" id="controls"><button id="prev">‹</button><button id="next">›</button></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section id="editor">
<div class="editorHead">Clinical Case Editor</div><div class="editorSub">Create a clean, professional clinical presentation without editing the HTML code.</div><div class="sectionTitle">CASE INFORMATION</div>
<div class="field"><label>CASE NAME</label><input id="caseName" value="Leukoplakia"></div>
<div class="field"><label>DOCTOR NAME</label><input id="doctor" value="Dr. Sanad Khandelwal"></div>
<div class="field"><label>CLINIC</label><input id="clinic" value="Aarogwan Precancer and Dental Care Centre"></div>
<div class="grid">
<div class="field"><label>ADDRESS</label><input id="address" value="Aliganj Sector L, LUCKNOW"></div>
<div class="field"><label>PHONE</label><input id="phone" value="+91 88401 63449"></div>
</div>
<div class="field"><label>NUMBER OF IMAGES</label>
<select id="count"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
</div>
<div class="sectionTitle">CLINICAL IMAGES</div><div id="imageFields" class="imageFields"></div><div class="editorSub" style="margin-top:10px">Choose 1–5 images. Only the number you select will appear in the presentation.</div>
<div class="actions"><button class="close" id="close">Close</button><button class="save" id="save">Preview Presentation</button></div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
const data={name:'Leukoplakia',doctor:'Dr. Sanad Khandelwal',clinic:'Aarogwan Precancer and Dental Care Centre',address:'Aliganj Sector L, LUCKNOW',phone:'+91 88401 63449',count:3,items:[]};
const defaults=[
['PRE-OPERATIVE','Pre-Operative','Clinical appearance before treatment'],
['POST-OPERATIVE','Post-Operative','Clinical appearance after procedure'],
['HEALING • 11 DAYS','Healing After 11 Days','Healing documented at 11 days'],
['FOLLOW-UP','Clinical Follow-Up','Follow-up clinical view'],
['FINAL RESULT','Final Clinical Result','Follow-up result']
];
for(let i=0;i<5;i++)data.items.push({label:defaults[i][0],title:defaults[i][1],desc:defaults[i][2],src:''});
let current=0,timer=null;
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderEditor(){
$('caseName').value=data.name;$('doctor').value=data.doctor;$('clinic').value=data.clinic;$('address').value=data.address;$('phone').value=data.phone;$('count').value=data.count;
$('imageFields').classList.add('show');$('imageFields').innerHTML='';
for(let i=0;i<data.count;i++){
const r=document.createElement('div');r.className='imgRow';
r.innerHTML='<div class="imgHead"><span class="num">'+(i+1)+'</span><strong>Clinical Image '+(i+1)+'</strong></div><div class="field"><label>STAGE / LABEL</label><input class="lbl"></div><div class="field"><label>HEADLINE</label><input class="ttl"></div><div class="field"><label>CLINICAL DESCRIPTION</label><textarea class="dsc"></textarea></div><label class="upload">＋ Choose image from device<input class="file" type="file" accept="image/*"></label><div class="fileName">No image selected</div>';
r.querySelector('.lbl').value=data.items[i].label;r.querySelector('.ttl').value=data.items[i].title;r.querySelector('.dsc').value=data.items[i].desc;
r.querySelector('.file').onchange=()=>{const f=r.querySelector('.file').files[0];if(f){r.querySelector('.fileName').textContent=f.name;const rd=new FileReader();rd.onload=()=>data.items[i].src=rd.result;rd.readAsDataURL(f)}};
$('imageFields').appendChild(r);
}}
function build(){
data.name=$('caseName').value;data.doctor=$('doctor').value;data.clinic=$('clinic').value;data.address=$('address').value;data.phone=$('phone').value;data.count=+$('count').value;
[...$('imageFields').children].forEach((r,i)=>{data.items[i].label=r.querySelector('.lbl').value;data.items[i].title=r.querySelector('.ttl').value;data.items[i].desc=r.querySelector('.dsc').value});
const s=$('slides');s.innerHTML='';
const intro=document.createElement('article');intro.className='slide';
intro.innerHTML='<div class="top"><div class="doctor">'+esc(data.doctor)+'</div><div class="clinic">'+esc(data.clinic)+'</div><div class="address">'+esc(data.address)+'</div><div class="phone">'+esc(data.phone)+'</div></div><div class="kicker">CLINICAL CASE</div><h1>'+esc(data.name)+'</h1><div class="desc">Clinical case presentation</div><div class="caseCard"><div><span>CASE</span><strong>'+esc(data.name)+'</strong></div><div><span>DOCUMENTATION</span><strong>Clinical photographic record</strong></div><div><span>FOLLOW-UP</span><strong>As documented in the case</strong></div></div><div class="introNote">Presented for clinical documentation and educational review.</div>';
s.appendChild(intro);
for(let i=0;i<data.count;i++){const x=data.items[i],el=document.createElement('article');el.className='slide';
el.innerHTML='<div class="top"><div class="doctor">'+esc(data.doctor)+'</div><div class="clinic">'+esc(data.clinic)+'</div><div class="address">'+esc(data.address)+'</div><div class="phone">'+esc(data.phone)+'</div></div><div class="label">'+String(i+1).padStart(2,'0')+' / '+esc(x.label)+'</div><div class="stage">'+esc(x.title)+'</div><h2>'+esc(x.title)+'</h2><div class="desc">'+esc(x.desc)+'</div><div class="imageBox">'+(x.src?'<img src="'+x.src+'" alt="">':'<div class="small">Image not selected</div>')+'</div>';s.appendChild(el)}
const end=document.createElement('article');end.className='slide';
end.innerHTML='<div class="top"><div class="doctor">'+esc(data.doctor)+'</div><div class="clinic">'+esc(data.clinic)+'</div><div class="address">'+esc(data.address)+'</div><div class="phone">'+esc(data.phone)+'</div></div><div class="kicker" style="margin-top:auto">CASE COMPLETE</div><h1>'+esc(data.name)+'<br>Clinical Result</h1><div class="desc">Thank you for viewing this clinical case.</div><div class="end"><div class="doc">'+esc(data.doctor)+'</div><div class="clinicEnd">'+esc(data.clinic)+'<br>'+esc(data.address)+'</div></div>';s.appendChild(end);show(0)}
function show(n){const all=[...document.querySelectorAll('.slide')];if(!all.length)return;current=(n+all.length)%all.length;all.forEach((x,i)=>x.classList.toggle('active',i===current));$('bar').style.width=((current+1)/all.length*100)+'%'}
function start(){clearInterval(timer);timer=setInterval(()=>show(current+1),6000)}
$('prev').onclick=()=>{show(current-1);start()};$('next').onclick=()=>{show(current+1);start()};
let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45){show(current+(dx<0?1:-1));start()}},{passive:true});
$('count').onchange=renderEditor;
$('save').onclick=()=>{build();$('editor').classList.remove('open');start()};
$('close').onclick=()=>{$('editor').classList.remove('open');start()};
let taps=0,tapTimer,longPress;
$('editHot').onclick=()=>{taps++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>taps=0,1400);if(taps>=5){taps=0;clearInterval(timer);renderEditor();$('editor').classList.add('open')}};
$('editHot').addEventListener('pointerdown',()=>{longPress=setTimeout(()=>{clearInterval(timer);renderEditor();$('editor').classList.add('open')},1200)});
$('editHot').addEventListener('pointerup',()=>clearTimeout(longPress));
$('editHot').addEventListener('pointerleave',()=>clearTimeout(longPress));
build();start();
</script>
</body>
</html>
